<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TV Explorer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>TV Explorer</h1>
      <p>Consumo de API pública (TVMaze)</p>
    </header>

    <section class="card p-4 mb-4">
      <div class="row g-2 align-items-center">
        <div class="col-md-4 col-12">
          <input id="searchQuery" class="form-control" placeholder="Buscar série (ex: Friends)">
        </div>
        <div class="col-md-3 col-6">
          <select id="genreSelect" class="form-select">
            <option value="">Filtrar por gênero</option>
            <option value="Drama">Drama</option>
            <option value="Comedy">Comédia</option>
            <option value="Action">Ação</option>
            <option value="Romance">Romance</option>
            <option value="Horror">Terror</option>
            <option value="Thriller">Suspense</option>
          </select>
        </div>
        <div class="col-md-5 col-12 d-flex flex-wrap gap-2 justify-content-end">
          <button id="btnSearch" class="btn btn-success btn-custom">Buscar</button>
          <button id="btnShowGenres" class="btn btn-info btn-custom">Gêneros únicos</button>
          <button id="btnByGenre" class="btn btn-primary btn-custom">Por gênero</button>
          <button id="btnById" class="btn btn-warning btn-custom">Buscar por ID</button>
        </div>
      </div>
    </section>

    <div id="results" class="row g-4"></div>

    <footer>
      <p>Desenvolvido por <strong>Marco Antonio Gonçalves</strong></p>
    </footer>
  </div>

  <script>
    const API_BASE = 'https://api.tvmaze.com';
    const resultsEl = document.getElementById('results');

    function clearResults() { resultsEl.innerHTML = ''; }

    function createCard(show) {
      const title = show.name || 'Sem título';
      const img = show.image?.medium || 'https://via.placeholder.com/210x295?text=Sem+Imagem';
      const genres = show.genres?.join(', ') || 'N/A';
      const premiered = show.premiered || 'N/A';
      const rating = show.rating?.average || 'N/A';
      const summary = show.summary ? show.summary.replace(/<[^>]+>/g, '') : 'Sem descrição.';

      const col = document.createElement('div');
      col.className = 'col-12 col-sm-6 col-md-4 col-lg-3';
      col.innerHTML = `
        <div class="card h-100">
          <img src="${img}" class="card-img-top" alt="${title}">
          <div class="card-body">
            <h5 class="card-title">${title}</h5>
            <p class="card-text small">
              <b>Gêneros:</b> ${genres}<br>
              <b>Estreia:</b> ${premiered}<br>
              <b>Nota:</b> ${rating}
            </p>
            <p class="small">${summary}</p>
          </div>
        </div>`;
      return col;
    }

    async function searchShows() {
      clearResults();
      const q = document.getElementById('searchQuery').value.trim() || 'Batman';
      const resp = await fetch(`${API_BASE}/search/shows?q=${encodeURIComponent(q)}`);
      const data = await resp.json();
      data.forEach(item => resultsEl.appendChild(createCard(item.show)));
    }

    async function getShowById() {
      clearResults();
      const id = document.getElementById('searchQuery').value.trim() || '431';
      const resp = await fetch(`${API_BASE}/shows/${id}`);
      const data = await resp.json();
      resultsEl.appendChild(createCard(data));
    }

    async function showUniqueGenres() {
      clearResults();
      const resp = await fetch(`${API_BASE}/shows`);
      const data = await resp.json();
      const genres = [...new Set(data.flatMap(s => s.genres))].sort();
      resultsEl.innerHTML = `
        <div class="col-12">
          <div class="card p-3">
            <h5>Gêneros únicos</h5>
            <ul>${genres.map(g => `<li>${g}</li>`).join('')}</ul>
          </div>
        </div>`;
    }

    async function searchByGenre() {
      clearResults();
      const genre = document.getElementById('genreSelect').value || 'Drama';
      const resp = await fetch(`${API_BASE}/shows`);
      const data = await resp.json();
      const filtered = data.filter(s => s.genres.includes(genre));
      filtered.slice(0, 40).forEach(show => resultsEl.appendChild(createCard(show)));
    }

    document.getElementById('btnSearch').onclick = searchShows;
    document.getElementById('btnById').onclick = getShowById;
    document.getElementById('btnByGenre').onclick = searchByGenre;
    document.getElementById('btnShowGenres').onclick = showUniqueGenres;
  </script>

  <div id="logsModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);justify-content:center;align-items:center;z-index:999;">
    <div style="background:#1b1e24;padding:20px;border-radius:10px;width:90%;max-width:600px;max-height:80%;overflow-y:auto;">
      <button style="background:red;color:white;border:none;padding:5px 10px;border-radius:5px;float:right;cursor:pointer;" onclick="fecharLogs()">X</button>
      <h2>Logs Registrados</h2>
      <div id="listaLogs"></div>
    </div>
  </div>

<script>
const MATRICULA = "413016";

async function buscarFilmes() {
  const termo = document.getElementById("termo").value.trim();
  const lista = document.getElementById("lista");

  if (!termo) {
    alert("Digite o nome de um filme para buscar.");
    return;
  }

  lista.innerHTML = "<p>Carregando filmes...</p>";

  try {
    const resposta = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(termo)}`);
    const dados = await resposta.json();

    lista.innerHTML = "";

    if (dados.length === 0) {
      lista.innerHTML = "<p>Nenhum filme encontrado.</p>";
    } else {
      dados.forEach(item => {
        const filme = item.show;
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <h3>${filme.name}</h3>
          <p><strong>Gênero:</strong> ${filme.genres.join(", ") || "N/A"}</p>
          <p><strong>Ano:</strong> ${filme.premiered ? filme.premiered.split("-")[0] : "N/A"}</p>
        `;
        lista.appendChild(card);
      });

      await registrarLog("api.tvmaze.com", `GET /search/shows?q=${termo}`, `Resultados: ${dados.length}`);
    }
  } catch (erro) {
    console.error("Erro ao buscar filmes:", erro);
  }
}

async function registrarLog(api, metodo, resultado) {
  const url = `https://www.piway.com.br/unoesc/api/inserir/log/${MATRICULA}/${api}/${encodeURIComponent(metodo)}/${encodeURIComponent(resultado)}`;
  try {
    const resposta = await fetch(url);
    const dados = await resposta.text();
    console.log("Log inserido:", dados);
  } catch (erro) {
    console.error("Erro ao registrar log:", erro);
  }
}

async function abrirLogs() {
  document.getElementById("logsModal").style.display = "flex";
  await carregarLogs();
}

function fecharLogs() {
  document.getElementById("logsModal").style.display = "none";
}

async function carregarLogs() {
  const lista = document.getElementById("listaLogs");
  lista.innerHTML = "<p>Carregando logs...</p>";

  try {
    const resposta = await fetch(`https://www.piway.com.br/unoesc/api/logs/${MATRICULA}`);
    const logs = await resposta.json();

    if (logs.length === 0) {
      lista.innerHTML = "<p>Nenhum log registrado ainda.</p>";
      return;
    }

    lista.innerHTML = logs.map(log => `
      <div class='logItem'>
        <p><strong>ID:</strong> ${log.id}</p>
        <p><strong>API:</strong> ${log.api}</p>
        <p><strong>Método:</strong> ${log.metodo}</p>
        <p><strong>Resultado:</strong> ${log.resultado}</p>
        <button onclick="excluirLog(${log.id})">Excluir</button>
      </div>
    `).join("");
  } catch (erro) {
    lista.innerHTML = "<p>Erro ao carregar logs.</p>";
    console.error("Erro ao buscar logs:", erro);
  }
}

async function excluirLog(id) {
  try {
    const resposta = await fetch(`https://www.piway.com.br/unoesc/api/excluir/log/${id}/aluno/${MATRICULA}`);
    const dados = await resposta.text();
    alert(dados);
    carregarLogs();
  } catch (erro) {
    console.error("Erro ao excluir log:", erro);
  }
}
</script>

</body>
</html>
